<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Рядом — звонок</title>
<style>
  html,body{margin:0;min-height:100%;background:#0F0E12;color:#E8DCC8;font-family:Manrope,system-ui,-apple-system,sans-serif}
  main{max-width:440px;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;gap:18px;min-height:100vh;box-sizing:border-box;justify-content:center}
  h1{margin:0;font-size:28px;line-height:1.25}
  p{margin:0;font-size:16px;line-height:1.55;color:#D9CDB9}
  .num{font-size:36px;font-weight:800;color:#D4A5A5;white-space:nowrap}
  .what{font-size:15px;color:#A69C8E;margin-top:-10px}
  a.call{display:flex;align-items:center;justify-content:center;gap:10px;height:64px;border-radius:32px;background:#D4A5A5;color:#0F0E12;font-size:20px;font-weight:800;text-decoration:none}
  .small{font-size:13px;color:#8F8678}
</style>
</head>
<body>
<main>
  <h1>Ты всё делаешь правильно.</h1>
  <p>Сейчас откроется звонок. На том конце — живой человек, который выслушает.</p>
  <div class="num" id="num"></div>
  <div class="what" id="what"></div>
  <a class="call" id="btn" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F0E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Позвонить</a>
  <p class="small">Если звонок не начался сам — нажми кнопку. После разговора можно вернуться в Telegram.</p>
</main>
<script>
(function () {
  // Только эти номера: страницу нельзя использовать для звонка куда-то ещё.
  var NUMS = {
    '+7495051': ['051', 'Неотложная психологическая помощь, Москва'],
    '+74959895050': ['+7 495 989-50-50', 'Психологическая помощь МЧС России'],
    '112': ['112', 'Единый номер экстренных служб']
  };
  var q = new URLSearchParams(location.search);
  // SMS близкому человеку: номер и текст задаёт сам пользователь в приложении
  var sms = q.get('sms');
  if (sms && /^\+\d{10,15}$/.test(sms)) {
    var body = (q.get('body') || '').slice(0, 500);
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
    var href = 'sms:' + sms + (ios ? '&' : '?') + 'body=' + encodeURIComponent(body);
    document.querySelector('h1').textContent = 'Сообщение готово';
    document.querySelector('p').textContent = 'Сейчас откроются SMS с уже набранным текстом. Останется нажать «Отправить».';
    document.getElementById('num').textContent = sms;
    document.getElementById('what').textContent = body;
    var b = document.getElementById('btn'); b.href = href; b.lastChild.textContent = 'Открыть SMS';
    setTimeout(function () { location.href = href; }, 400);
    return;
  }
  var n = q.get('n') || '';
  var info = NUMS[n] || NUMS['+7495051'];
  if (!NUMS[n]) n = '+7495051';
  document.getElementById('num').textContent = info[0];
  document.getElementById('what').textContent = info[1];
  var btn = document.getElementById('btn');
  btn.href = 'tel:' + n;
  setTimeout(function () { location.href = 'tel:' + n; }, 400);
})();
</script>
</body>
</html>
