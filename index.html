<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Рядом</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0F0E12;--dusk:#1C1923;--deep:#17141C;--line:#2E2936;--line2:#3A3444;--line3:#4A4252;
  --light:#E8DCC8;--soft:#D9CDB9;--muted:#A69C8E;--faint:#8F8678;
  --gold:#C9A876;--rose:#D4A5A5;--water:#7B8FA1;--water2:#A3B2C0;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--light);font-family:Manrope,system-ui,-apple-system,sans-serif;font-weight:500}
button,textarea,a{font-family:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
h1{margin:0;font-size:27px;line-height:1.22;font-weight:700}
p{margin:0}
.col{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g18{gap:18px}.g20{gap:20px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}.faint{color:var(--faint)}.soft{color:var(--soft)}
.s12{font-size:12px}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}
.b6{font-weight:600}.b7{font-weight:700}
.lh{line-height:1.55}
.up{font-size:12px;letter-spacing:1px;font-weight:700;text-transform:uppercase}
.card{background:var(--dusk);border-radius:22px;padding:18px}
.card-dash{border:1px dashed var(--line3);border-radius:22px;padding:18px;background:transparent}
.card-line{border:1px solid var(--line);border-radius:18px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:26px;border:none;font-size:16px;font-weight:700;text-decoration:none;width:100%}
.btn-gold{background:var(--gold);color:var(--night)}
.btn-rose{background:var(--rose);color:var(--night)}
.btn-out{background:transparent;border:1px solid var(--line3);color:var(--light);font-weight:500}
.btn-out-rose{background:transparent;border:1px solid var(--rose);color:#F3E3E3;font-weight:600}
.btn-off{background:var(--line);color:var(--muted)}
.tile{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:22px;border:none;background:var(--dusk);color:var(--light);width:100%}
.opt{display:flex;align-items:center;min-height:54px;padding:0 20px;border-radius:18px;font-size:16px;text-align:left;background:var(--dusk);color:var(--light);border:1px solid var(--line);width:100%}
.opt.on{background:var(--light);color:var(--night);border-color:var(--light);font-weight:700}
.chip{height:42px;padding:0 16px;border-radius:21px;font-size:14px;white-space:nowrap;flex-shrink:0;background:transparent;color:var(--light);border:1px solid var(--line2)}
.chip.on{background:var(--gold);color:var(--night);border-color:var(--gold);font-weight:700}
.chip.light.on{background:var(--light);border-color:var(--light)}
.dots{display:flex;gap:6px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.ta{width:100%;resize:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--night);color:var(--light);font-size:16px;line-height:1.5}
.ta::placeholder{color:#6F675C}
.hscroll{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;height:60px;padding:6px 16px 0;background:var(--night)}
.back{display:flex;align-items:center;gap:2px;height:44px;padding:0 14px 0 8px;border-radius:22px;border:1px solid var(--line);background:var(--deep);color:var(--light);font-size:15px;font-weight:600}
.hdr-title{position:absolute;left:110px;right:110px;text-align:center;font-size:16px;font-weight:600;color:var(--soft);top:24px}
.content{padding:8px 20px calc(130px + var(--safe-b))}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:6px 6px calc(12px + var(--safe-b));border-top:1px solid #1F1C26;background:var(--night)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-height:52px;border:none;background:transparent;color:var(--faint);font-size:11px;font-weight:600}
.tab.on{color:var(--gold)}
.tab-sos{display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:transparent;color:#F0CFCF;font-size:11px;font-weight:700;padding:0}
.tab-sos span.c{margin-top:-30px;width:62px;height:62px;border-radius:31px;background:var(--rose);border:4px solid var(--night);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;letter-spacing:1px;color:var(--night)}

/* sos */
.sos-hero{display:flex;align-items:center;gap:16px;text-align:left;padding:20px 18px;border-radius:24px;border:1.5px solid var(--rose);background:#2A1F27;color:#F3E3E3;width:100%}
.sos-dot{position:relative;width:56px;height:56px;border-radius:28px;background:var(--rose);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--night);font-size:15px;font-weight:800;letter-spacing:1px}
.sos-dot::after{content:"";position:absolute;inset:-6px;border-radius:34px;border:2px solid var(--rose);animation:softpulse 2.4s ease-in-out infinite}
.hot{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:22px;border:1.5px solid var(--rose);background:#2A1F27}
.hot a{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;text-decoration:none;color:#F3E3E3;border:1px solid var(--rose)}
.hot a.main{background:var(--rose);color:var(--night);border-color:var(--rose)}
.hot .ic{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--rose)}
.hot a.main .ic{background:var(--night);border-color:var(--night)}
.hot a.dim{border-color:#4A3640}

/* misc */
.toggle{position:relative;width:52px;height:32px;flex-shrink:0;border-radius:16px;border:none;background:var(--line2)}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:var(--night);transition:left .15s}
.toggle.on{background:var(--gold)}.toggle.on::after{left:24px}
.progress{display:block;height:5px;border-radius:3px;background:#26222E;overflow:hidden}
.progress b{display:block;height:100%;background:var(--gold);border-radius:3px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:130px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:100%;max-width:30px;border-radius:8px}
.bar.empty{height:8px;border:1px dashed var(--line3);border-radius:6px}
.tag{padding:4px 10px;border-radius:10px;font-size:11px;font-weight:700}
.entry{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:16px;background:var(--deep);border:1px solid #26222E}
.entry .txt{font-size:14px;line-height:1.5;white-space:pre-line;word-wrap:break-word}
.linkbtn{background:none;border:none;color:var(--faint);font-size:12px;padding:4px 0}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:24px;background:var(--deep);border:1px solid #26222E}
.seg button{height:42px;border-radius:20px;border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:600}
.seg button.on{background:var(--light);color:var(--night);font-weight:700}
.pico{width:48px;height:48px;border-radius:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--night);font-size:14px;font-weight:700;border:1px solid}
.check{width:28px;height:28px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--line3);font-weight:800;font-size:15px}
.check.on{background:var(--gold);border-color:var(--gold);color:var(--night)}
.anx-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.anx-grid button{height:48px;border-radius:14px;font-size:16px;font-weight:700;background:var(--dusk);color:var(--light);border:1px solid var(--line)}
.pill{padding:8px 14px;border-radius:16px;font-size:14px}
.toast{position:fixed;left:20px;right:20px;bottom:calc(110px + var(--safe-b));max-width:440px;margin:0 auto;padding:14px 16px;border-radius:16px;background:var(--light);color:var(--night);font-size:14px;font-weight:600;z-index:20;text-align:center}

/* breathing */
.stage{position:relative;width:280px;height:280px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.stage .r{position:absolute;border-radius:50%}
.r1{width:280px;height:280px;border:1px solid var(--water)}
.r2{width:204px;height:204px;border:1px solid var(--water2)}
.r3{width:128px;height:128px;border:1px solid var(--gold);background:var(--dusk)}
.calm .r{animation:breathe 9s ease-in-out infinite}
.sighA .r{animation:sighK 9s ease-in-out infinite}
.r2{animation-delay:.25s!important}.r3{animation-delay:.5s!important}
.says{position:relative;height:34px;width:300px;margin:0 auto}
.says span{position:absolute;inset:0;text-align:center;font-size:22px;font-weight:600}
.calm-in{animation:inhale 9s linear infinite}.calm-out{animation:exhale 9s linear infinite;color:var(--water2)}
.sg1{animation:sg1 9s linear infinite}.sg2{animation:sg2 9s linear infinite;opacity:0;color:var(--gold)}.sg3{animation:sg3 9s linear infinite;opacity:0;color:var(--water2)}

/* splash */
.splash{position:fixed;inset:0;z-index:30;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;color:var(--light);width:100%;padding:0}
.splash .st{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
.splash .sr{position:absolute;width:200px;height:200px;border-radius:100px;animation:splashRing 3s ease-out infinite}
.splash .sr:nth-child(2){animation-delay:1s}.splash .sr:nth-child(3){animation-delay:2s}
.sp-logo{animation:splashIn 1s ease-out .2s both}
.sp-word{margin-top:10px;font-size:40px;font-weight:500;letter-spacing:.5px;animation:splashIn 1s ease-out .9s both}
.sp-cap{position:absolute;left:0;right:0;bottom:calc(84px + var(--safe-b));text-align:center;font-size:17px;line-height:1.5;color:var(--soft);animation:splashIn 1s ease-out 1.8s both}
.sp-bar{position:absolute;bottom:calc(52px + var(--safe-b));left:50%;margin-left:-50px;width:100px;height:3px;border-radius:2px;background:#26222E;overflow:hidden}
.sp-bar i{display:block;height:3px;background:var(--gold);animation:splashBar 5s linear both}

@keyframes breathe{0%{transform:scale(.62);opacity:.35}50%{transform:scale(1);opacity:.95}100%{transform:scale(.62);opacity:.35}}
@keyframes sighK{0%{transform:scale(.6);opacity:.4}22%{transform:scale(.88);opacity:.8}33%{transform:scale(1);opacity:1}100%{transform:scale(.6);opacity:.4}}
@keyframes inhale{0%,46%{opacity:1}50%,96%{opacity:0}100%{opacity:1}}
@keyframes exhale{0%,46%{opacity:0}50%,96%{opacity:1}100%{opacity:0}}
@keyframes sg1{0%,20%{opacity:1}22%,98%{opacity:0}100%{opacity:1}}
@keyframes sg2{0%,20%{opacity:0}22%,31%{opacity:1}33%,100%{opacity:0}}
@keyframes sg3{0%,31%{opacity:0}33%,96%{opacity:1}98%,100%{opacity:0}}
@keyframes softpulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.1);opacity:1}}
@keyframes splashRing{0%{transform:scale(.4);opacity:0}30%{opacity:.8}100%{transform:scale(1.6);opacity:0}}
@keyframes splashIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
@keyframes splashBar{from{width:0}to{width:100%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.calm-out,.sg2,.sg3{opacity:0!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   «Рядом» — Telegram Mini App (MVP, без сервера)
   Данные хранятся в Telegram CloudStorage пользователя,
   вне Telegram — в localStorage (для проверки в браузере).
   ========================================================= */

const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const tgAtLeast = (v) => { try { return !!tg && tg.isVersionAtLeast(v); } catch (e) { return false; } };

if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { if (tgAtLeast('6.1')) { tg.setHeaderColor('#0F0E12'); tg.setBackgroundColor('#0F0E12'); } } catch (e) {}
  try { if (tgAtLeast('7.10')) tg.setBottomBarColor('#0F0E12'); } catch (e) {}
  try { if (tgAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
}
const haptic = (kind) => {
  try {
    if (!tgAtLeast('6.1')) return;
    if (kind === 'select') tg.HapticFeedback.selectionChanged();
    else if (kind === 'ok') tg.HapticFeedback.notificationOccurred('success');
    else tg.HapticFeedback.impactOccurred(kind || 'light');
  } catch (e) {}
};

/* ---------- хранилище ---------- */
const useCloud = inTG && tgAtLeast('6.9') && tg.CloudStorage;
const store = {
  getMany(keys) {
    if (!keys.length) return Promise.resolve({});
    if (!useCloud) {
      const out = {}; keys.forEach((k) => { out[k] = localStorage.getItem('ryadom_' + k) || ''; });
      return Promise.resolve(out);
    }
    const chunks = []; for (let i = 0; i < keys.length; i += 20) chunks.push(keys.slice(i, i + 20));
    return Promise.all(chunks.map((ch) => new Promise((res) => {
      tg.CloudStorage.getItems(ch, (err, vals) => res(err ? {} : (vals || {})));
    }))).then((parts) => Object.assign({}, ...parts));
  },
  set(key, val) {
    if (!useCloud) { try { localStorage.setItem('ryadom_' + key, val); } catch (e) {} return; }
    tg.CloudStorage.setItem(key, val, () => {});
  },
  remove(key) {
    if (!useCloud) { try { localStorage.removeItem('ryadom_' + key); } catch (e) {} return; }
    tg.CloudStorage.removeItem(key, () => {});
  }
};
const parse = (s, d) => { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } };

/* ---------- состояние ---------- */
const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const S = {
  screen: 'splash', stack: [], loaded: false, splashDone: false,
  name: (user && user.first_name) || 'друг',
  history: [],          // чек-ины: {t, m(0-4), a(0-10), s(0-3), tp:[...]}
  entries: [],          // записи: {id, t, g:'free'|'q'|'worry'|'dump', x}
  feels: [],            // {t, p, v:'better'|'bit'|'no'}
  prefs: { remindOn: true, remindTimes: ['21:00'], done: {} },
  ci: { step: 0, m: null, a: null, s: null, tp: [] },
  diaryMode: 'free', draft: '', qIdx: 0, qDraft: '', qAnswers: [], justSaved: false,
  gStep: 0, feel: null, lastPractice: '',
  pFilter: 'all', pid: 'pmr', pStep: 0,
  wKind: 'worry', wDraft: '', wTime: '19:00', wDone: false,
  toast: ''
};

function saveHistory() { store.set('hist', JSON.stringify(S.history.slice(0, 50))); }
function savePrefs() { store.set('prefs', JSON.stringify(S.prefs)); }
function saveFeels() { store.set('feels', JSON.stringify(S.feels.slice(0, 50))); }
function saveEntryIndex() { store.set('eidx', JSON.stringify(S.entries.slice(0, 150).map((e) => e.id))); }
function addEntry(g, x) {
  const e = { id: String(Date.now()), t: Date.now(), g: g, x: x.slice(0, 3500) };
  S.entries.unshift(e);
  store.set('e_' + e.id, JSON.stringify(e));
  saveEntryIndex();
  markDone('diary');
}
function deleteEntry(id) {
  S.entries = S.entries.filter((e) => e.id !== id);
  store.remove('e_' + id);
  saveEntryIndex();
}
function markDone(k) { if (!S.prefs.done[k]) { S.prefs.done[k] = true; savePrefs(); } }

function load() {
  return store.getMany(['hist', 'prefs', 'feels', 'eidx']).then((v) => {
    S.history = parse(v.hist, []);
    S.prefs = Object.assign(S.prefs, parse(v.prefs, {}));
    S.prefs.done = S.prefs.done || {};
    S.feels = parse(v.feels, []);
    const ids = parse(v.eidx, []);
    return store.getMany(ids.map((id) => 'e_' + id)).then((ev) => {
      S.entries = ids.map((id) => parse(ev['e_' + id], null)).filter(Boolean);
    });
  }).catch(() => {}).then(() => { S.loaded = true; maybeLeaveSplash(); });
}

/* ---------- справочники ---------- */
const MOODS = ['Очень тяжело', 'Тяжело', 'Так себе', 'Нормально', 'Хорошо'];
const SLEEPS = ['Плохо', 'С перерывами', 'Нормально', 'Хорошо'];
const TOPICS = ['Учёба / работа', 'Отношения', 'Семья', 'Здоровье', 'Будущее', 'Деньги', 'Сам(а) не знаю'];
const SHORT = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const WD = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
const QS = [
  { q: 'Что ты сейчас чувствуешь?', h: 'Одним-двумя словами: тревога, пустота, злость, усталость…', k: 'Что чувствую' },
  { q: 'Где в теле ты это замечаешь?', h: 'Грудь, живот, плечи, горло…', k: 'Где в теле' },
  { q: 'Что произошло перед тем, как стало так?', h: 'Событие, мысль, разговор — или ничего особенного', k: 'Что было перед этим' },
  { q: 'Какая мысль звучит в голове громче всего?', h: 'Запиши её как есть, без оценки', k: 'Главная мысль' },
  { q: 'Что сказал бы тебе близкий друг, если бы был рядом?', h: 'Попробуй ответить его голосом', k: 'Слова друга' }
];
const GROUND = [
  { big: '5', t: 'Назови 5 вещей, которые видишь', h: 'Можно шёпотом. Лампа, чашка, край одеяла…' },
  { big: '4', t: 'Найди 4 звука вокруг', h: 'Холодильник, машины за окном, твоё дыхание.' },
  { big: '3', t: 'Потрогай 3 предмета', h: 'Какие они: тёплые, гладкие, мягкие?' },
  { big: '2', t: 'Заметь 2 запаха', h: 'Если не получается — вспомни любимые.' },
  { big: '1', t: 'Сделай один медленный выдох', h: 'Длиннее вдоха. Плечи можно опустить.' }
];
const PRAC = {
  pmr: { title: 'Расслабить мышцы', note: 'Напрягай без боли, примерно вполсилы. Если есть травма или где-то болит — пропусти этот шаг.', steps: [
    { l: 'Кисти', t: 'Сожми кулаки.\nПодержи 5 секунд… и отпусти.', h: 'Посиди 10 секунд и заметь разницу между напряжением и расслаблением.' },
    { l: 'Плечи', t: 'Подними плечи к ушам.\nПодержи… и опусти.', h: 'Пусть они опустятся чуть ниже, чем были.' },
    { l: 'Лицо', t: 'Зажмурься и сожми губы.\nПодержи… и отпусти.', h: 'Разожми челюсть, язык мягко лежит во рту.' },
    { l: 'Живот', t: 'Втяни и напряги живот.\nПодержи… и отпусти.', h: 'Дыши свободно, без задержек.' },
    { l: 'Ноги', t: 'Потяни носки на себя.\nПодержи… и отпусти.', h: 'Почувствуй, как ноги становятся тяжелее.' },
    { l: 'Всё тело', t: 'Сделай медленный выдох.\nГде сейчас стало мягче?', h: 'Можно повторить любой шаг ещё раз.' }
  ] },

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
function whenOf(ts) {
  const d = new Date(ts), n = new Date();
  const diff = Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  const day = diff === 0 ? 'Сегодня' : diff === 1 ? 'Вчера' : diff < 7 ? SHORT[d.getDay()] : pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
  return day + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

  if (screen === 'feel') S.feel = null;

function back() {
  if (S.screen === 'checkin' && S.ci.step > 0 && S.ci.step < 4) { S.ci.step--; return render(); }

  render(true);
}

function buildSummary() {
  const weekAgo = Date.now() - 7 * 86400000;
  const hs = S.history.filter((h) => h.t >= weekAgo);
  const es = S.entries.filter((e) => e.t >= weekAgo);
  const fs = S.feels.filter((f) => f.t >= weekAgo);
  if (!hs.length && !es.length) return null;
  const out = { lines: [] };
  if (hs.length) {
    const avg = hs.reduce((a, h) => a + h.a, 0) / hs.length;
    const worst = hs.reduce((a, h) => (h.a > a.a ? h : a), hs[0]);
    const evening = hs.filter((h) => new Date(h.t).getHours() >= 18 || new Date(h.t).getHours() < 5);
    const tcount = {}; hs.forEach((h) => (h.tp || []).forEach((i) => { tcount[i] = (tcount[i] || 0) + 1; }));
    const top = Object.keys(tcount).sort((a, b) => tcount[b] - tcount[a]).slice(0, 3).map((i) => TOPICS[i].toLowerCase());
    out.state = `Чек-инов: ${hs.length}. Средняя тревога — ${avg.toFixed(1).replace('.', ',')} из 10. Тяжелее всего было: ${whenOf(worst.t).toLowerCase()} (${worst.a}/10).`
      + (evening.length && hs.length > 1 ? ` Вечером и ночью — ${evening.length} из ${hs.length} отметок.` : '');
    if (top.length) out.topics = 'Чаще всего занимало мысли: ' + top.join(', ') + '.';
  }
  const helped = {}; fs.filter((f) => f.v !== 'no').forEach((f) => { helped[f.p] = (helped[f.p] || 0) + 1; });
  const hk = Object.keys(helped);
  if (hk.length) out.helped = 'Помогло: ' + hk.map((k) => (PNAMES[k] || k) + ' (' + helped[k] + ')').join(', ') + '.';
  if (es.length) out.notes = es.slice(0, 4).map((e) => '— ' + e.x.split('\n')[0].slice(0, 140));
  return out;
}
function summaryText(sm) {
  const parts = ['Конспект «Рядом» за 7 дней'];
  if (sm.state) parts.push('\nСостояние\n' + sm.state);
  if (sm.topics) parts.push(sm.topics);
  if (sm.helped) parts.push('\nЧто помогло\n' + sm.helped);
  if (sm.notes) parts.push('\nИз записей\n' + sm.notes.join('\n'));
  return parts.join('\n');
}

    <div class="col g8"><div class="row between s13"><span class="b7">Знакомство</span><span class="b7" style="color:var(--gold)">${n} из 5</span></div><span class="progress"><b style="width:${n * 20}%"></b></span></div>
    <div class="col g10">${items.map((it) => { const ok = !!S.prefs.done[it[0]]; return `<button class="tile" data-act="nav" data-arg="${it[3]}" data-arg2="${it[4]}" style="padding:16px;border-radius:18px"><span class="check ${ok ? 'on' : ''}">${ok ? '✓' : ''}</span><span class="col g4" style="flex:1"><span class="s15 b7" style="${ok ? 'color:var(--muted)' : ''}">${it[1]}</span><span class="s12 muted">${it[2]}</span></span>${I.chevR()}</button>`; }).join('')}</div>
    <div class="card-line col g6"><span class="s14 b7">Чем я не являюсь</span><span class="s13 lh muted">Я не ставлю диагнозы и не даю советов вместо психолога. Если есть угроза жизни — звони 112.</span></div>
  </div>`;
}

/* ---------- рендер ---------- */
const VIEWS = { home: vHome, sos: vSos, checkin: vCheckin, state: vState, diary: vDiary, summary: vSummary, practices: vPractices, breathe: vBreathe, sigh: vSigh, ground: vGround, prac: vPrac, write: vWrite, feel: vFeel, onboard: vOnboard };
function vSplash() {
  return `<button class="splash" data-act="skipSplash" aria-label="Пропустить заставку">
    <span class="st"><span class="sr" style="border:1px solid #7B8FA1"></span><span class="sr" style="border:1px solid #C9A876"></span><span class="sr" style="border:1px solid #D4A5A5"></span><span class="sp-logo">${LOTUS(104)}</span></span>
    <span class="sp-word">Рядом</span>
    <span class="sp-cap">Всё наладится.<br><span style="color:var(--gold)">Мы рядом</span></span>
    <span class="sp-bar"><i></i></span>
  </button>`;
}
function render(scrollTop) {
  const app = document.getElementById('app');
  if (S.screen === 'splash') { app.innerHTML = vSplash(); syncBack(); return; }
  const sc = S.screen, isHome = sc === 'home', active = ROOT[sc] || '';
  const header = isHome
    ? `<div class="row g10" style="padding-left:4px">${LOTUS(30)}<span style="font-size:20px;font-weight:600">Рядом</span></div><span></span>`
    : `<button class="back" data-act="back" aria-label="Назад">${I.chevL}Назад</button><span class="hdr-title">${TITLES[sc] || ''}</span><span style="width:44px"></span>`;
  app.innerHTML = `<div class="hdr">${header}</div>
    <main class="content">${(VIEWS[sc] || vHome)()}</main>
    <nav class="tabs">
      <button class="tab ${active === 'home' ? 'on' : ''}" data-act="tab" data-arg="home">${I.home}Главная</button>
      <button class="tab ${active === 'practices' ? 'on' : ''}" data-act="tab" data-arg="practices">${I.rings}Практики</button>
      <button class="tab-sos" data-act="nav" data-arg="sos" aria-label="SOS — мне плохо прямо сейчас"><span class="c">SOS</span>Помощь</button>
      <button class="tab ${active === 'diary' ? 'on' : ''}" data-act="tab" data-arg="diary">${I.book}Дневник</button>
      <button class="tab ${active === 'state' ? 'on' : ''}" data-act="tab" data-arg="state">${I.chart}Состояние</button>
    </nav>
    ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
  if (scrollTop) window.scrollTo(0, 0);
  syncBack();
}
function syncBack() {
  if (!tg) return;
  try { if (S.screen !== 'home' && S.screen !== 'splash') tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {}
}
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ''; render(); }, 2600); }

/* ---------- действия ---------- */
const ACT = {
  nav: (a, el) => nav(a, el.dataset.arg2 || undefined),
  tab: (a) => tab(a),
  back: () => back(),
  home: () => { S.screen = 'home'; S.stack = []; render(true); },
  skipSplash: () => { S.splashDone = true; if (S.loaded) { S.screen = 'home'; render(true); } },
  ciMood: (a) => { S.ci.m = +a; S.ci.step = 1; haptic('select'); render(true); },
  ciAnx: (a) => { S.ci.a = +a; S.ci.step = 2; haptic('select'); render(true); },
  ciSleep: (a) => { S.ci.s = +a; S.ci.step = 3; haptic('select'); render(true); },
  ciTopic: (a) => { const i = +a, tp = S.ci.tp; S.ci.tp = tp.indexOf(i) >= 0 ? tp.filter((x) => x !== i) : tp.concat([i]); haptic('select'); render(); },
  ciFinish: () => {
    const c = S.ci;
    S.history.unshift({ t: Date.now(), m: c.m == null ? 2 : c.m, a: c.a == null ? 5 : c.a, s: c.s == null ? 2 : c.s, tp: c.tp });
    saveHistory(); markDone('checkin'); c.step = 4; haptic('ok'); render(true);
  },
  remindToggle: () => { S.prefs.remindOn = !S.prefs.remindOn; markDone('remind'); savePrefs(); render(); },
  remindTime: (t) => { const r = S.prefs.remindTimes; S.prefs.remindTimes = r.indexOf(t) >= 0 ? r.filter((x) => x !== t) : r.concat([t]); savePrefs(); haptic('select'); render(); },
  diaryMode: (m) => { S.diaryMode = m; S.justSaved = false; render(); },
  saveFree: () => { if (!S.draft.trim()) return; addEntry('free', S.draft.trim()); S.draft = ''; S.justSaved = true; haptic('ok'); render(); },
  qSkip: () => advanceQ(''),
  qNext: () => advanceQ(S.qDraft.trim()),
  delEntry: (id) => {
    const go = () => { deleteEntry(id); render(); };
    if (tg && tgAtLeast('6.2')) tg.showConfirm('Удалить эту запись насовсем?', (ok) => { if (ok) go(); });
    else if (window.confirm('Удалить эту запись насовсем?')) go();
  },
  copySummary: () => {
    const sm = buildSummary(); if (!sm) return;
    const text = summaryText(sm);
    const done = () => toast('Скопировано — можно вставить в заметки или отправить психологу');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  },
  call: (num) => {
    haptic('medium');
    if (inTG) {
      const url = new URL('call.html', location.href); url.searchParams.set('n', num);
      try { tg.openLink(url.href); return; } catch (e) {}
    }
    location.href = 'tel:' + num;
  },
  calendar: (kind) => {
    const url = new URL('remind.html', location.href);
    url.searchParams.set('k', kind);
    url.searchParams.set('t', kind === 'worry' ? S.wTime : S.prefs.remindTimes.join(','));
    if (kind === 'checkin') markDone('remind');
    haptic('light');
    if (inTG) { try { tg.openLink(url.href); return; } catch (e) {} }
    window.open(url.href, '_blank');
  },
  copyNum: (num) => {
    const done = () => toast('Номер ' + num + ' скопирован');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(num).then(done, () => fallbackCopy(num, done));
    else fallbackCopy(num, done);
  },
  pFilter: (f) => { S.pFilter = f; haptic('select'); render(); },
  practice: (id) => { const p = PRACTICES.find((x) => x.id === id); nav(p.go[0], p.go[1]); },
  gNext: () => { if (S.gStep >= 4) nav('feel'); else { S.gStep++; haptic('select'); render(); } },
  pNext: () => { const pr = PRAC[S.pid]; if (S.pStep >= pr.steps.length - 1) nav('feel'); else { S.pStep++; haptic('select'); render(); } },
  wTime: (t) => { S.wTime = t; haptic('select'); render(); },
  wSave: () => {
    if (!S.wDraft.trim()) return;
    const day = new Date().getHours() < 18 ? 'сегодня' : 'завтра';
    addEntry(S.wKind, S.wKind === 'worry' ? 'Вернусь к этому ' + day + ' в ' + S.wTime + ':\n' + S.wDraft.trim() : S.wDraft.trim());
    S.wDone = true; haptic('ok'); render(true);
  },
  feel: (v) => { S.feel = v; if (S.lastPractice) { S.feels.unshift({ t: Date.now(), p: S.lastPractice, v: v }); saveFeels(); } render(true); }
};
function advanceQ(answer) {
  if (answer) S.qAnswers.push(QS[Math.min(S.qIdx, 4)].k + ' — ' + answer);
  S.qDraft = '';
  if (S.qIdx < 4) { S.qIdx++; return render(); }
  if (S.qAnswers.length) { addEntry('q', S.qAnswers.join('\n')); S.justSaved = true; haptic('ok'); }
  S.qIdx = 0; S.qAnswers = []; render();
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); cb();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset.arg, el); }
});
document.addEventListener('input', (e) => {
  const m = e.target.dataset && e.target.dataset.model; if (!m) return;
  S[m] = e.target.value;
  const b = e.target.dataset.btn && document.getElementById(e.target.dataset.btn);
  if (b) { const has = e.target.value.trim().length > 0; b.classList.toggle('btn-gold', has); b.classList.toggle('btn-off', !has); }
});

/* ---------- старт ---------- */
render();
load();
setTimeout(() => { S.splashDone = true; maybeLeaveSplash(); }, 5000);
</script>
</body>
</html>
