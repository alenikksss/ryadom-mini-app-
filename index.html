<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Рядом</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0F0E12;--dusk:#1C1923;--deep:#17141C;--line:#2E2936;--line2:#3A3444;--line3:#4A4252;
  --light:#E8DCC8;--soft:#D9CDB9;--muted:#A69C8E;--faint:#8F8678;
  --gold:#C9A876;--rose:#D4A5A5;--water:#7B8FA1;--water2:#A3B2C0;--sage:#9FB0A0;
  --safe-b:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  --safe-t:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--light);font-family:Manrope,system-ui,-apple-system,sans-serif;font-weight:500}
button,textarea,input,a{font-family:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
h1{margin:0;font-size:28px;line-height:1.2;font-weight:700}
h2{margin:0;font-size:20px;line-height:1.3;font-weight:700}
p{margin:0}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}.g32{gap:32px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.soft{color:var(--soft)}
.s12{font-size:12px}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}
.b6{font-weight:600}.b7{font-weight:700}
.lh{line-height:1.55}
.up{font-size:12px;letter-spacing:1px;font-weight:700;text-transform:uppercase}
.card{background:var(--dusk);border-radius:24px;padding:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:27px;border:none;font-size:16px;font-weight:700;text-decoration:none;width:100%}
.btn-gold{background:var(--gold);color:var(--night)}
.btn-rose{background:var(--rose);color:var(--night)}
.btn-out{background:transparent;border:1px solid var(--line3);color:var(--light);font-weight:500}
.btn-ghost{background:transparent;border:none;color:var(--muted);font-weight:500;min-height:44px}
.btn-off{background:var(--line);color:var(--muted)}
.tile{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:20px;border:none;background:var(--dusk);color:var(--light);width:100%}
.listrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:16px 4px;border:none;border-bottom:1px solid #1F1C26;background:transparent;color:var(--light);text-align:left;font-size:16px}
.listrow:last-child{border-bottom:none}
.opt{display:flex;align-items:center;min-height:54px;padding:0 20px;border-radius:18px;font-size:16px;text-align:left;background:var(--dusk);color:var(--light);border:1px solid var(--line);width:100%}
.opt.on{background:var(--light);color:var(--night);border-color:var(--light);font-weight:700}
.chip{height:42px;padding:0 16px;border-radius:21px;font-size:14px;white-space:nowrap;flex-shrink:0;background:transparent;color:var(--light);border:1px solid var(--line2)}
.chip.on{background:var(--light);color:var(--night);border-color:var(--light);font-weight:700}
.dots{display:flex;gap:6px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.ta,.inp{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--night);color:var(--light);font-size:16px;line-height:1.5}
.ta{resize:none}
.ta::placeholder,.inp::placeholder{color:#6F675C}
.hscroll{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:calc(6px + var(--safe-t)) 16px 6px;background:var(--night)}
.back{display:flex;align-items:center;gap:2px;height:44px;padding:0 14px 0 8px;border-radius:22px;border:1px solid var(--line);background:var(--deep);color:var(--light);font-size:15px;font-weight:600}
.hdr-title{position:absolute;left:110px;right:110px;text-align:center;font-size:16px;font-weight:600;color:var(--soft);bottom:18px}
.hdr-title.solo{left:20px;right:20px}
.content{padding:12px 20px calc(130px + var(--safe-b))}
.content.bare{padding-bottom:calc(40px + var(--safe-b))}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:6px 6px calc(12px + var(--safe-b));border-top:1px solid #1F1C26;background:var(--night)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-height:52px;border:none;background:transparent;color:var(--faint);font-size:11px;font-weight:600}
.tab.on{color:var(--gold)}
.tab-sos{display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:transparent;color:#F0CFCF;font-size:11px;font-weight:700;padding:0}
.tab-sos span.c{margin-top:-30px;width:64px;height:64px;border-radius:32px;background:var(--rose);border:4px solid var(--night);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;letter-spacing:1px;color:var(--night);position:relative}
.tab-sos span.c::after{content:"";position:absolute;inset:-8px;border-radius:40px;border:2px solid var(--rose);opacity:.5;animation:softpulse 2.8s ease-in-out infinite}

/* home */
.hero{position:relative;padding:8px 2px 0;min-height:120px}
.hero .decor{position:absolute;right:-6px;top:-4px;width:132px;height:132px;pointer-events:none}
.hero .decor .r{position:absolute;inset:0;margin:auto;border-radius:50%;animation:breathe 9s ease-in-out infinite}
.sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sugg button{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;border-radius:20px;border:none;background:var(--dusk);color:var(--light);text-align:left;min-height:128px}
/* mood grid */
.moods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mood{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--deep);color:var(--light);text-align:left;min-height:92px}
.mood i{width:14px;height:14px;border-radius:7px;display:block}
.mood b{font-size:16px}
.mood span{font-size:12px;color:var(--muted)}
.mood.on{border-color:var(--light)}

/* sos */
.hot{display:flex;flex-direction:column;border-radius:20px;border:1px solid #3A2C34;background:#1E1820;overflow:hidden}
.hot a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;text-decoration:none;color:#F3E3E3;border-bottom:1px solid #3A2C34}
.hot a:last-child{border-bottom:none}
.callic{width:40px;height:40px;border-radius:20px;background:var(--rose);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.who{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#2A1F27;border:none;color:#F3E3E3;width:100%;text-align:left}
.ava{width:40px;height:40px;border-radius:20px;background:var(--rose);color:var(--night);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}

.toggle{position:relative;width:52px;height:32px;flex-shrink:0;border-radius:16px;border:none;background:var(--line2)}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:var(--night);transition:left .15s}
.toggle.on{background:var(--gold)}.toggle.on::after{left:24px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:120px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:100%;max-width:30px;border-radius:8px}
.bar.empty{height:8px;border:1px dashed var(--line3);border-radius:6px}
.tag{padding:4px 10px;border-radius:10px;font-size:11px;font-weight:700}
.entry{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:16px;background:var(--deep);border:1px solid #26222E}
.entry .txt{font-size:14px;line-height:1.5;white-space:pre-line;word-wrap:break-word}
.linkbtn{background:none;border:none;color:var(--faint);font-size:13px;padding:6px 0}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:24px;background:var(--deep);border:1px solid #26222E}
.seg button{height:42px;border-radius:20px;border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:600}
.seg button.on{background:var(--light);color:var(--night);font-weight:700}
.pico{width:44px;height:44px;border-radius:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--night);font-size:13px;font-weight:700;border:1px solid}
.toast{position:fixed;left:20px;right:20px;bottom:calc(110px + var(--safe-b));max-width:440px;margin:0 auto;padding:14px 16px;border-radius:16px;background:var(--light);color:var(--night);font-size:14px;font-weight:600;z-index:20;text-align:center}
.feature{display:flex;gap:14px;align-items:flex-start}
.feature .fi{width:36px;height:36px;border-radius:18px;background:var(--dusk);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.preview{padding:14px 16px;border-radius:18px 18px 18px 6px;background:#2B2533;font-size:14px;line-height:1.5;color:var(--soft)}

/* breathing */
.stage{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.stage .r{position:absolute;border-radius:50%}
.r1{width:260px;height:260px;border:1px solid var(--water)}
.r2{width:190px;height:190px;border:1px solid var(--water2)}
.r3{width:120px;height:120px;border:1px solid var(--gold);background:var(--dusk)}
.calm .r{animation:breathe 9s ease-in-out infinite}
.sighA .r{animation:sighK 9s ease-in-out infinite}
.r2{animation-delay:.25s!important}.r3{animation-delay:.5s!important}
.says{position:relative;height:34px;width:300px;margin:0 auto}
.says span{position:absolute;inset:0;text-align:center;font-size:22px;font-weight:600}
.calm-in{animation:inhale 9s linear infinite}.calm-out{animation:exhale 9s linear infinite;color:var(--water2)}
.sg1{animation:sg1 9s linear infinite}.sg2{animation:sg2 9s linear infinite;opacity:0;color:var(--gold)}.sg3{animation:sg3 9s linear infinite;opacity:0;color:var(--water2)}

/* splash */
.splash{position:fixed;inset:0;z-index:30;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;color:var(--light);width:100%;padding:0}
.splash .st{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
.splash .sr{position:absolute;width:200px;height:200px;border-radius:100px;animation:splashRing 3s ease-out infinite}
.splash .sr:nth-child(2){animation-delay:1s}.splash .sr:nth-child(3){animation-delay:2s}
.sp-logo{animation:splashIn 1s ease-out .2s both}
.sp-word{margin-top:10px;font-size:40px;font-weight:500;letter-spacing:.5px;animation:splashIn 1s ease-out .9s both}
.sp-cap{position:absolute;left:0;right:0;bottom:calc(84px + var(--safe-b));text-align:center;font-size:17px;line-height:1.5;color:var(--soft);animation:splashIn 1s ease-out 1.8s both}
.sp-bar{position:absolute;bottom:calc(52px + var(--safe-b));left:50%;margin-left:-50px;width:100px;height:3px;border-radius:2px;background:#26222E;overflow:hidden}
.sp-bar i{display:block;height:3px;background:var(--gold);animation:splashBar 5s linear both}

@keyframes breathe{0%{transform:scale(.62);opacity:.35}50%{transform:scale(1);opacity:.95}100%{transform:scale(.62);opacity:.35}}
@keyframes sighK{0%{transform:scale(.6);opacity:.4}22%{transform:scale(.88);opacity:.8}33%{transform:scale(1);opacity:1}100%{transform:scale(.6);opacity:.4}}
@keyframes inhale{0%,46%{opacity:1}50%,96%{opacity:0}100%{opacity:1}}
@keyframes exhale{0%,46%{opacity:0}50%,96%{opacity:1}100%{opacity:0}}
@keyframes sg1{0%,20%{opacity:1}22%,98%{opacity:0}100%{opacity:1}}
@keyframes sg2{0%,20%{opacity:0}22%,31%{opacity:1}33%,100%{opacity:0}}
@keyframes sg3{0%,31%{opacity:0}33%,96%{opacity:1}98%,100%{opacity:0}}
@keyframes softpulse{0%,100%{transform:scale(.92);opacity:.25}50%{transform:scale(1.05);opacity:.6}}
@keyframes splashRing{0%{transform:scale(.4);opacity:0}30%{opacity:.8}100%{transform:scale(1.6);opacity:0}}
@keyframes splashIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
@keyframes splashBar{from{width:0}to{width:100%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.calm-out,.sg2,.sg3{opacity:0!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* «Рядом» — Telegram Mini App v3 (без сервера; данные в Telegram CloudStorage) */

const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const tgAtLeast = (v) => { try { return !!tg && tg.isVersionAtLeast(v); } catch (e) { return false; } };
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { if (tgAtLeast('6.1')) { tg.setHeaderColor('#0F0E12'); tg.setBackgroundColor('#0F0E12'); } } catch (e) {}
  try { if (tgAtLeast('7.10')) tg.setBottomBarColor('#0F0E12'); } catch (e) {}
  try { if (tgAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
}
// внутри Telegram используем его собственную кнопку «Назад»
const nativeBack = inTG && tgAtLeast('6.1');
const haptic = (k) => { try { if (!tgAtLeast('6.1')) return; if (k === 'select') tg.HapticFeedback.selectionChanged(); else if (k === 'ok') tg.HapticFeedback.notificationOccurred('success'); else tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} };

/* ---------- хранилище ---------- */
const useCloud = inTG && tgAtLeast('6.9') && tg.CloudStorage;
const store = {
  getMany(keys) {
    if (!keys.length) return Promise.resolve({});
    if (!useCloud) { const o = {}; keys.forEach((k) => { o[k] = localStorage.getItem('ryadom_' + k) || ''; }); return Promise.resolve(o); }
    const ch = []; for (let i = 0; i < keys.length; i += 20) ch.push(keys.slice(i, i + 20));
    return Promise.all(ch.map((c) => new Promise((res) => tg.CloudStorage.getItems(c, (err, v) => res(err ? {} : (v || {}))))))
      .then((parts) => Object.assign({}, ...parts));
  },
  set(k, v) { if (!useCloud) { try { localStorage.setItem('ryadom_' + k, v); } catch (e) {} return; } tg.CloudStorage.setItem(k, v, () => {}); },
  remove(k) { if (!useCloud) { try { localStorage.removeItem('ryadom_' + k); } catch (e) {} return; } tg.CloudStorage.removeItem(k, () => {}); }
};
const parse = (s, d) => { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } };

/* ---------- состояние ---------- */
const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const DEFAULT_MSG = 'Привет. Мне сейчас очень тяжело. Можешь написать или позвонить, когда увидишь?';
const S = {
  screen: 'splash', stack: [], loaded: false, splashDone: false,
  name: (user && user.first_name) || 'друг',
  history: [], entries: [], feels: [],
  prefs: { onboarded: false, remindTimes: ['21:00'], contacts: [], msg: DEFAULT_MSG, plan: '' },
  onb: 0, onbMood: null,
  ci: { q: null, i: null, w: null, done: false },
  sosOpen: false,
  cName: '', cHandle: '', cErr: '',
  diaryMode: 'free', draft: '', qIdx: 0, qDraft: '', qAnswers: [], justSaved: false,
  gStep: 0, feel: null, lastPractice: '', pFilter: 'all', pid: 'pmr', pStep: 0,
  wKind: 'worry', wDraft: '', wTime: '19:00', wDone: false, showAll: false, toast: ''
};
const saveHistory = () => store.set('hist', JSON.stringify(S.history.slice(0, 60)));
const savePrefs = () => store.set('prefs', JSON.stringify(S.prefs));
const saveFeels = () => store.set('feels', JSON.stringify(S.feels.slice(0, 60)));
const saveEntryIndex = () => store.set('eidx', JSON.stringify(S.entries.slice(0, 150).map((e) => e.id)));
function addEntry(g, x) { const e = { id: String(Date.now()), t: Date.now(), g: g, x: x.slice(0, 3500) }; S.entries.unshift(e); store.set('e_' + e.id, JSON.stringify(e)); saveEntryIndex(); }
function deleteEntry(id) { S.entries = S.entries.filter((e) => e.id !== id); store.remove('e_' + id); saveEntryIndex(); }

function load() {
  return store.getMany(['hist', 'prefs', 'feels', 'eidx']).then((v) => {
    S.history = parse(v.hist, []).map(normCheckin);
    const p = parse(v.prefs, {});
    S.prefs = Object.assign(S.prefs, p);
    if (!Array.isArray(S.prefs.contacts)) S.prefs.contacts = [];
    if (!S.prefs.msg) S.prefs.msg = DEFAULT_MSG;
    // пользователи прошлой версии уже знакомы с приложением
    if (p.done && Object.keys(p.done).length && p.onboarded === undefined) S.prefs.onboarded = true;
    S.feels = parse(v.feels, []);
    const ids = parse(v.eidx, []);
    return store.getMany(ids.map((id) => 'e_' + id)).then((ev) => { S.entries = ids.map((id) => parse(ev['e_' + id], null)).filter(Boolean); });
  }).catch(() => {}).then(() => { S.loaded = true; leaveSplash(); });
}
// старый формат чек-ина {m, a} → новый {q, i}
function normCheckin(h) {
  if (h.q !== undefined) return h;
  const a = h.a == null ? 5 : h.a;
  return { t: h.t, q: a >= 4 ? 0 : 3, i: Math.max(1, Math.min(5, Math.round(a / 2))), w: null };
}

/* ---------- справочники ---------- */
const MOODS = [
  { k: 'anx', label: 'Тревожно', hint: 'мысли несутся', c: '#D4A5A5', words: ['беспокойство', 'паника', 'напряжение', 'страх'] },
  { k: 'low', label: 'Тяжело', hint: 'грустно, нет сил', c: '#7B8FA1', words: ['грусть', 'усталость', 'одиночество', 'вина'] },
  { k: 'numb', label: 'Пусто', hint: 'ничего не чувствую', c: '#8F8678', words: ['апатия', 'оцепенение', 'скука', 'растерянность'] },
  { k: 'ok', label: 'Спокойно', hint: 'в целом нормально', c: '#C9A876', words: ['спокойствие', 'облегчение', 'надежда', 'благодарность'] }
];
const SHORT = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const QS = [
  { q: 'Что ты сейчас чувствуешь?', h: 'Одним-двумя словами: тревога, пустота, злость, усталость…', k: 'Что чувствую' },
  { q: 'Где в теле ты это замечаешь?', h: 'Грудь, живот, плечи, горло…', k: 'Где в теле' },
  { q: 'Что произошло перед тем, как стало так?', h: 'Событие, мысль, разговор — или ничего особенного', k: 'Что было перед этим' },
  { q: 'Какая мысль звучит в голове громче всего?', h: 'Запиши её как есть, без оценки', k: 'Главная мысль' },
  { q: 'Что сказал бы тебе близкий друг, если бы был рядом?', h: 'Попробуй ответить его голосом', k: 'Слова друга' }
];
const GROUND = [
  { big: '5', t: 'Назови 5 вещей, которые видишь', h: 'Можно шёпотом. Лампа, чашка, край одеяла…' },
  { big: '4', t: 'Найди 4 звука вокруг', h: 'Холодильник, машины за окном, твоё дыхание.' },
  { big: '3', t: 'Потрогай 3 предмета', h: 'Какие они: тёплые, гладкие, мягкие?' },
  { big: '2', t: 'Заметь 2 запаха', h: 'Если не получается — вспомни любимые.' },
  { big: '1', t: 'Сделай один медленный выдох', h: 'Длиннее вдоха. Плечи можно опустить.' }
];

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => (n < 10 ? '0' : '') + n;
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; if (m === 1 && h !== 11) return a; if (m >= 2 && m <= 4 && (h < 12 || h > 14)) return b; return c; };
function whenOf(ts) {
  const d = new Date(ts), n = new Date();
  const diff = Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  const day = diff === 0 ? 'Сегодня' : diff === 1 ? 'Вчера' : diff < 7 ? SHORT[d.getDay()] : pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
  return day + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
const todayCheckin = () => { const h = S.history[0]; return h && sameDay(new Date(h.t), new Date()) ? h : null; };
// мягкий прогресс: сколько из последних 10 дней была хоть одна забота о себе
function careDays() {
  const days = new Set(); const since = Date.now() - 10 * 86400000;
  S.history.concat(S.entries).concat(S.feels).forEach((x) => { if (x.t >= since) { const d = new Date(x.t); days.add(d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate()); } });
  return days.size;
}
function parseHandle(raw) {
  const v = (raw || '').trim();
  const digits = v.replace(/[^\d+]/g, '');
  if (/^\+?\d{10,15}$/.test(digits) && /\d{10,}/.test(digits.replace('+', ''))) {
    let d = digits.replace('+', '');
    if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1);
    if (d.length === 10) d = '7' + d;
    return { kind: 'phone', value: '+' + d };
  }
  const u = v.replace(/^https?:\/\/t\.me\//i, '').replace(/^@/, '');
  if (/^[A-Za-z][A-Za-z0-9_]{3,31}$/.test(u)) return { kind: 'tg', value: u };
  return null;
}

  if (screen === 'checkin') S.ci = { q: arg == null ? null : +arg, i: null, w: null, done: false };

  if (screen === 'contacts') { S.cName = ''; S.cHandle = ''; S.cErr = ''; }

function back() {

  if (S.screen === 'checkin' && S.ci.done === false && S.ci.i !== null) { S.ci.i = null; return render(); }
  if (S.screen === 'ground' && S.gStep > 0) { S.gStep--; return render(); }

}

function buildSummary() {
  const since = Date.now() - 7 * 86400000;
  const hs = S.history.filter((h) => h.t >= since), es = S.entries.filter((e) => e.t >= since), fs = S.feels.filter((f) => f.t >= since);
  if (!hs.length && !es.length) return null;
  const out = {};
  if (hs.length) {
    const cnt = [0, 0, 0, 0]; hs.forEach((h) => cnt[h.q]++);
    const parts = MOODS.map((m, i) => cnt[i] ? m.label.toLowerCase() + ' — ' + cnt[i] : '').filter(Boolean);
    const strong = hs.filter((h) => (h.q === 0 || h.q === 1) && h.i >= 4);
    const ev = hs.filter((h) => { const x = new Date(h.t).getHours(); return x >= 18 || x < 5; });
    const words = {}; hs.forEach((h) => { if (h.w) words[h.w] = (words[h.w] || 0) + 1; });
    const topw = Object.keys(words).sort((a, b) => words[b] - words[a]).slice(0, 3);
    out.state = 'Отметок: ' + hs.length + ' (' + parts.join(', ') + ').' + (strong.length ? ' Сильно тяжело было ' + strong.length + ' ' + plural(strong.length, 'раз', 'раза', 'раз') + ', последний — ' + whenOf(strong[0].t).toLowerCase() + '.' : '') + (ev.length && hs.length > 1 ? ' Вечером и ночью — ' + ev.length + ' из ' + hs.length + '.' : '');
    if (topw.length) out.words = 'Чаще всего: ' + topw.join(', ') + '.';
  }
  const helped = {}; fs.filter((f) => f.v !== 'no').forEach((f) => { helped[f.p] = (helped[f.p] || 0) + 1; });
  const hk = Object.keys(helped);
  if (hk.length) out.helped = hk.map((k) => (PNAMES[k] || k) + ' (' + helped[k] + ')').join(', ') + '.';
  if (es.length) out.notes = es.slice(0, 4).map((e) => '— ' + e.x.split('\n')[0].slice(0, 140));
  return out;
}
function summaryText(sm) {
  const p = ['Конспект «Рядом» за 7 дней'];

  if (sm.helped) p.push('\nЧто помогло\n' + sm.helped);
  if (sm.notes) p.push('\nИз записей\n' + sm.notes.join('\n'));
  return p.join('\n');
}

}
function vWrite() {
  const worry = S.wKind === 'worry', day = new Date().getHours() < 18 ? 'сегодня' : 'завтра';
  if (S.wDone) {
    return `<div class="col g16">
      <h1>${worry ? 'Мысль подождёт до ' + S.wTime : 'Всё записано'}</h1>
      <p class="s15 lh soft">${worry ? 'Если она вернётся раньше — скажи ей: «Не сейчас, в ' + S.wTime + '». Часто к этому времени она уже не кажется такой срочной.' : 'Список в дневнике и никуда не денется. Можно отпустить эти мысли до утра. Спокойной ночи, ' + esc(S.name) + '.'}</p>
      ${worry ? `<button class="btn btn-gold" data-act="calendar" data-arg="worry">Напомнить в ${S.wTime}</button>` : ''}
      <button class="btn btn-ghost" data-act="home">На главную</button>
    </div>`;
  }
  const has = S.wDraft.trim().length > 0;
  return `<div class="col g20">
    <div class="col g8"><h1>${worry ? 'Отложить тревогу' : 'Выгрузить мысли перед сном'}</h1>
      <span class="s14 lh muted">${worry ? 'Запишем мысль и вернёмся к ней позже, в спокойное время.' : 'Запиши всё, что нужно сделать завтра. Чем конкретнее, тем проще отпустить.'}</span></div>
    <textarea id="wt" class="ta" rows="4" data-model="wDraft" data-btn="wSave" aria-label="${worry ? 'Что тревожит?' : 'Что нужно сделать?'}" placeholder="${worry ? 'Что тревожит? Например: вдруг я провалю экзамен' : '— написать преподавателю&#10;— купить продукты'}">${esc(S.wDraft)}</textarea>
    ${worry ? `<div class="col g10"><span class="s14 muted" style="padding-left:2px">Вернёмся к ней ${day}:</span>
      <div class="row g8">${['18:00', '19:00', '20:00'].map((t) => `<button class="chip ${S.wTime === t ? 'on' : ''}" data-act="wTime" data-arg="${t}" style="flex:1">${t}</button>`).join('')}</div></div>` : ''}
    <button id="wSave" class="btn ${has ? 'btn-gold' : 'btn-off'}" data-act="wSave">${worry ? 'Отложить до ' + S.wTime : 'Выгрузить и отпустить'}</button>
  </div>`;
}
function vFeel() {
  if (!S.feel) {
    return `<div class="col g14"><h1>Стало хоть немного легче?</h1>
      <button class="btn btn-gold" data-act="feel" data-arg="better">Да</button>
      <button class="btn btn-out" data-act="feel" data-arg="bit">Немного</button>
      <button class="btn btn-out" data-act="feel" data-arg="no">Нет, всё ещё плохо</button></div>`;
  }
  const F = { better: ['Ты сделал(а) это сам(а).', 'Если хочешь, запиши, что помогло, — это хороший материал для сессии.'], bit: ['Немного — это уже шаг.', 'Можно повторить практику или выписать мысли.'], no: ['Спасибо, что сказал(а) честно.', 'Я могу не всё. Сейчас лучше поговорить с живым человеком — это нормально.'] }[S.feel];
  return `<div class="col g14"><h1>${F[0]}</h1><p class="s15 lh soft">${F[1]}</p>
    ${S.feel === 'no' ? (S.prefs.contacts.length ? `<button class="btn btn-rose" data-act="writeContact" data-arg="0">${I.send('#0F0E12')}Написать ${esc(S.prefs.contacts[0].name)}</button>` : '') + '<button class="btn btn-out" data-act="nav" data-arg="sos">Телефоны поддержки</button>' : '<button class="btn btn-out" data-act="nav" data-arg="diary">Записать</button>'}
    <button class="btn btn-ghost" data-act="home">На главную</button></div>`;
}
function vMe() {
  const row = (icon, t, s, arg) => `<button class="listrow" data-act="nav" data-arg="${arg}"><span class="row g12">${icon}<span class="col g4"><span class="s16 b6">${t}</span>${s ? `<span class="s13 muted">${s}</span>` : ''}</span></span>${I.chevR()}</button>`;
  const cs = S.prefs.contacts;
  return `<div class="col g20">
    <div class="row g12" style="padding:4px 2px">${LOTUS(44)}<div class="col g4"><span class="s17 b7">${esc(S.name)}</span><span class="s13 muted">${careDays()} из 10 дней с заботой о себе</span></div></div>
    <div class="card" style="padding:4px 16px">
      ${row(I.people('#D4A5A5'), 'Близкие люди', cs.length ? cs.map((c) => c.name).join(', ') : 'не добавлены', 'contacts')}
      ${row(I.chart('#7B8FA1'), 'Моя динамика', 'настроение за неделю', 'progress')}
      ${row(I.doc('#C9A876'), 'Конспект к сессии', '', 'summary')}
      ${row(I.clock('#A69C8E'), 'Время для себя', 'напоминания в календаре', 'reminders')}
    </div>
    <div class="card col g10">
      <span class="row g10 s15 b6">${I.lock('#7B8FA1')}Твои данные</span>
      <p class="s13 muted lh">Всё хранится в твоём облаке Telegram. Мы не видим твоих записей.</p>
      <button class="linkbtn" data-act="wipe" style="align-self:flex-start;color:var(--rose)">Удалить все мои данные</button>
    </div>
    <p class="s12 faint lh" style="padding:0 2px">«Рядом» не заменяет психолога. Если есть угроза жизни — звони 112.</p>
  </div>`;
}
function vContacts() {
  return `<div class="col g20">
    <div class="col g8"><h1>Близкие люди</h1><p class="s15 muted lh">Кому написать в трудную минуту. Кнопка появится первой в SOS.</p></div>
    ${contactsBlock()}
    <div class="col g10"><span class="s15 b7">Сообщение, которое будет набрано</span>
      <div class="preview">${esc(S.prefs.msg)}</div>
      <textarea class="ta" rows="3" data-model="msgDraft" aria-label="Изменить сообщение" placeholder="Изменить текст">${esc(S.prefs.msg)}</textarea>
      <button class="btn btn-out" data-act="saveMsg" style="min-height:46px">Сохранить текст</button>
    </div>
  </div>`;
}
function vReminders() {
  const times = [['10:00', 'утро'], ['15:00', 'день'], ['21:00', 'вечер']];
  return `<div class="col g20">
    <div class="col g8"><h1>Время для себя</h1><p class="s15 muted lh">Когда тебе удобно отмечать настроение? Поставим напоминание в календарь телефона.</p></div>
    <div class="row g8">${times.map(([t, l]) => `<button class="chip ${S.prefs.remindTimes.indexOf(t) >= 0 ? 'on' : ''}" data-act="remindTime" data-arg="${t}" style="flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span class="s15 b7">${t}</span><span style="font-size:11px;opacity:.8">${l}</span></button>`).join('')}</div>
    <button class="btn ${S.prefs.remindTimes.length ? 'btn-gold' : 'btn-off'}" data-act="calendar" data-arg="checkin">Добавить в календарь</button>
    <p class="s12 faint lh">В календаре событие называется «Рядом · минутка для себя» — без подробностей.</p>
  </div>`;
}

/* ---------- рендер ---------- */
const VIEWS = { home: vHome, sos: vSos, checkin: vCheckin, progress: vProgress, diary: vDiary, summary: vSummary, practices: vPractices, breathe: vBreathe, sigh: vSigh, ground: vGround, prac: vPrac, write: vWrite, feel: vFeel, me: vMe, contacts: vContacts, reminders: vReminders, onb: vOnb };
function vSplash() {
  return `<button class="splash" data-act="skipSplash" aria-label="Пропустить заставку">
    <span class="st"><span class="sr" style="border:1px solid #7B8FA1"></span><span class="sr" style="border:1px solid #C9A876"></span><span class="sr" style="border:1px solid #D4A5A5"></span><span class="sp-logo">${LOTUS(104)}</span></span>
    <span class="sp-word">Рядом</span><span class="sp-cap">Всё наладится.<br><span style="color:var(--gold)">Мы рядом</span></span><span class="sp-bar"><i></i></span></button>`;
}
function render(top) {
  const app = document.getElementById('app');
  const ae = document.activeElement, keep = ae && ae.dataset && ae.dataset.model ? ae.dataset.model : null;
  if (S.screen === 'splash') { app.innerHTML = vSplash(); syncBack(); return; }
  const sc = S.screen, isHome = sc === 'home', isOnb = sc === 'onb', active = ROOT[sc] || '';
  const header = isHome ? `<div class="row g10" style="padding-left:4px">${LOTUS(28)}<span style="font-size:19px;font-weight:600">Рядом</span></div><span></span>`
    : isOnb ? (S.onb !== 0 && !nativeBack ? `<button class="back" data-act="back" aria-label="Назад">${I.chevL}Назад</button><span></span>` : `<span></span><span></span>`)
    : nativeBack ? `<span class="hdr-title solo">${TITLES[sc] || ''}</span><span></span>`
    : `<button class="back" data-act="back" aria-label="Назад">${I.chevL}Назад</button><span class="hdr-title">${TITLES[sc] || ''}</span><span style="width:44px"></span>`;
  app.innerHTML = `<div class="hdr">${header}</div><main class="content ${isOnb ? 'bare' : ''}">${(VIEWS[sc] || vHome)()}</main>
    ${isOnb ? '' : `<nav class="tabs">
      <button class="tab ${active === 'home' ? 'on' : ''}" data-act="tab" data-arg="home">${I.home}Главная</button>
      <button class="tab ${active === 'practices' ? 'on' : ''}" data-act="tab" data-arg="practices">${I.rings}Практики</button>
      <button class="tab-sos" data-act="nav" data-arg="sos" aria-label="SOS — мне плохо прямо сейчас"><span class="c">SOS</span>Помощь</button>
      <button class="tab ${active === 'diary' ? 'on' : ''}" data-act="tab" data-arg="diary">${I.book}Дневник</button>
      <button class="tab ${active === 'me' ? 'on' : ''}" data-act="tab" data-arg="me">${I.me}Я</button></nav>`}
    ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
  if (top) window.scrollTo(0, 0);
  if (keep) { const el = app.querySelector('[data-model="' + keep + '"]'); if (el) { el.focus(); try { const n = el.value.length; el.setSelectionRange(n, n); } catch (e) {} } }
  syncBack();
}
function syncBack() { if (!tg) return; try { const show = S.screen !== 'home' && S.screen !== 'splash' && !(S.screen === 'onb' && S.onb === 0); if (show) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {} }
function toast(m) { S.toast = m; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ''; render(); }, 2600); }
function copyText(text, msg) { const done = () => toast(msg); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); else fallbackCopy(text, done); }
function fallbackCopy(text, cb) { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); cb(); }
function confirmBox(text, fn) { if (tg && tgAtLeast('6.2')) tg.showConfirm(text, (ok) => { if (ok) fn(); }); else if (window.confirm(text)) fn(); }

/* ---------- действия ---------- */
const ACT = {
  nav: (a, el) => nav(a, el.dataset.arg2 !== undefined && el.dataset.arg2 !== '' ? el.dataset.arg2 : undefined),
  tab: (a) => tab(a), back: () => back(),
  home: () => { S.screen = 'home'; S.stack = []; render(true); },
  skipSplash: () => { S.splashDone = true; leaveSplash(); },
  onbMood: (i) => { S.onbMood = +i; haptic('select'); S.history.unshift({ t: Date.now(), q: +i, i: 3, w: null }); saveHistory(); S.onb = (+i === 0 || +i === 1) ? 'relief' : 1; S.onbFrom = S.onb === 'relief' ? 'relief' : ''; S.lastPractice = S.onb === 'relief' ? 'sigh' : ''; render(true); },
  onbNext: () => { S.onb = S.onb === 'relief' ? 1 : S.onb + 1; haptic('select'); render(true); },
  onbDone: () => { S.prefs.onboarded = true; savePrefs(); S.screen = 'home'; S.stack = []; haptic('ok'); render(true); },
  plan: (p) => { S.prefs.plan = p; savePrefs(); haptic('select'); render(); },
  addHome: () => { try { tg.addToHomeScreen(); } catch (e) { toast('Не получилось — можно закрепить чат с ботом'); } },
  addContact: () => {
    const name = S.cName.trim(), h = parseHandle(S.cHandle);
    if (!name) { S.cErr = 'Напиши имя'; return render(); }
    if (!h) { S.cErr = 'Нужен ник в Telegram (@masha) или телефон (+7…)'; return render(); }
    S.prefs.contacts.push({ name: name.slice(0, 30), kind: h.kind, value: h.value }); savePrefs();
    S.cName = ''; S.cHandle = ''; S.cErr = ''; haptic('ok'); render();
  },
  delContact: (i) => confirmBox('Убрать этого человека из близких?', () => { S.prefs.contacts.splice(+i, 1); savePrefs(); render(); }),
  saveMsg: () => { const v = (S.msgDraft || '').trim(); if (v) { S.prefs.msg = v.slice(0, 500); savePrefs(); toast('Текст сохранён'); } },
  toggleSos: () => { S.sosOpen = !S.sosOpen; haptic('select'); render(); },
  writeContact: (i) => openContact(+i),
  smsContact: (i) => smsContact(+i),
  call: (num) => { haptic('medium'); if (inTG) { const u = new URL('call.html', location.href); u.searchParams.set('n', num); try { tg.openLink(u.href); return; } catch (e) {} } location.href = 'tel:' + num; },
  ciQ: (i) => { S.ci.q = +i; haptic('select'); render(true); },
  ciI: (v) => { S.ci.i = +v; haptic('select'); render(true); },
  ciW: (w) => { const c = S.ci; c.w = w || null; c.done = true; S.history.unshift({ t: Date.now(), q: c.q, i: c.i, w: c.w }); saveHistory(); haptic('ok'); render(true); },
  diaryMode: (m) => { S.diaryMode = m; S.justSaved = false; render(); },
  saveFree: () => { if (!S.draft.trim()) return; addEntry('free', S.draft.trim()); S.draft = ''; S.justSaved = true; haptic('ok'); render(); },
  qSkip: () => advanceQ(''), qNext: () => advanceQ(S.qDraft.trim()),
  showAll: () => { S.showAll = true; render(); },
  delEntry: (id) => confirmBox('Удалить эту запись насовсем?', () => { deleteEntry(id); render(); }),
  copySummary: () => { const sm = buildSummary(); if (sm) copyText(summaryText(sm), 'Скопировано — можно вставить в заметки или отправить психологу'); },
  pFilter: (f) => { S.pFilter = f; haptic('select'); render(); },
  practice: (id) => { const p = PRACTICES.find((x) => x.id === id); nav(p.go[0], p.go[1]); },
  gNext: () => { if (S.gStep >= 4) nav('feel'); else { S.gStep++; haptic('select'); render(); } },
  pNext: () => { const pr = PRAC[S.pid]; if (S.pStep >= pr.steps.length - 1) nav('feel'); else { S.pStep++; haptic('select'); render(); } },
  wTime: (t) => { S.wTime = t; haptic('select'); render(); },
  wSave: () => { if (!S.wDraft.trim()) return; const day = new Date().getHours() < 18 ? 'сегодня' : 'завтра'; addEntry(S.wKind, S.wKind === 'worry' ? 'Вернусь к этому ' + day + ' в ' + S.wTime + ':\n' + S.wDraft.trim() : S.wDraft.trim()); S.wDone = true; haptic('ok'); render(true); },
  feel: (v) => { S.feel = v; if (S.lastPractice) { S.feels.unshift({ t: Date.now(), p: S.lastPractice, v: v }); saveFeels(); } render(true); },
  remindTime: (t) => { const r = S.prefs.remindTimes; S.prefs.remindTimes = r.indexOf(t) >= 0 ? r.filter((x) => x !== t) : r.concat([t]); savePrefs(); haptic('select'); render(); },
  calendar: (kind) => {
    if (kind === 'checkin' && !S.prefs.remindTimes.length) return;
    const u = new URL('remind.html', location.href); u.searchParams.set('k', kind); u.searchParams.set('t', kind === 'worry' ? S.wTime : S.prefs.remindTimes.join(','));
    if (inTG) { try { tg.openLink(u.href); return; } catch (e) {} } window.open(u.href, '_blank');
  },
  wipe: () => confirmBox('Удалить все записи, отметки и близких? Это нельзя отменить.', () => {
    S.entries.forEach((e) => store.remove('e_' + e.id)); ['hist', 'feels', 'eidx', 'prefs'].forEach((k) => store.remove(k));
    S.entries = []; S.history = []; S.feels = []; S.prefs = { onboarded: false, remindTimes: ['21:00'], contacts: [], msg: DEFAULT_MSG, plan: '' };
    S.screen = 'onb'; S.onb = 0; S.stack = []; render(true);
  })
};
function advanceQ(a) {
  if (a) S.qAnswers.push(QS[Math.min(S.qIdx, 4)].k + ' — ' + a);
  S.qDraft = '';
  if (S.qIdx < 4) { S.qIdx++; return render(); }
  if (S.qAnswers.length) { addEntry('q', S.qAnswers.join('\n')); S.justSaved = true; haptic('ok'); }
  S.qIdx = 0; S.qAnswers = []; render();
}
document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (!el) return; const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset.arg, el); } });
document.addEventListener('input', (e) => {
  const m = e.target.dataset && e.target.dataset.model; if (!m) return;
  S[m] = e.target.value;
  const b = e.target.dataset.btn && document.getElementById(e.target.dataset.btn);
  if (b) { const has = e.target.value.trim().length > 0; b.classList.toggle('btn-gold', has); b.classList.toggle('btn-off', !has); }
});

render(); load();
setTimeout(() => { S.splashDone = true; leaveSplash(); }, 5000);
</script>
</body>
</html>
